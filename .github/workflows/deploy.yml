name: CI/CD — Réservia Bénin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build et tests du frontend React/Vite
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservia/frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reservia/frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sauvegarde du build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: reservia/frontend/dist/

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Vérification syntaxique du backend Laravel
  # ──────────────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend — Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservia/backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, xml, ctype, json, bcmath

      - name: Installation de Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Vérification de la syntaxe PHP
        run: find app -name "*.php" | xargs php -l

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Déploiement du frontend sur Vercel (uniquement sur main)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation de Vercel CLI
        run: npm install -g vercel@latest

      - name: Déploiement sur Vercel (production)
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            reservia/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Déploiement du backend sur Railway (uniquement sur main)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Railway CLI
        run: npm install -g @railway/cli

      - name: Déploiement sur Railway
        run: railway up --service backend
        working-directory: reservia/backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
