name: CI/CD — Réservia Bénin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Build frontend ──────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservia/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reservia/frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: reservia/frontend/dist/

  # ── 2. PHP syntax check ────────────────────────────────────────────────────
  backend-check:
    name: Backend — Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservia/backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, xml, bcmath

      - run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: PHP syntax check
        run: find app -name "*.php" | xargs php -l

  # ── 3. Deploy frontend → Vercel ────────────────────────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        working-directory: reservia/frontend
        run: vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 4. Deploy backend → Railway ────────────────────────────────────────────
  deploy-backend:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: reservia/backend
        run: railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
